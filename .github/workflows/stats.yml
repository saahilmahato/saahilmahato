name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide=stars
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated cards
        run: |
          set -e

          for file in profile/stats.svg profile/top-langs.svg; do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty SVG: $file"
              exit 1
            fi

            if ! grep -q '<svg' "$file"; then
              echo "::error::Invalid SVG output: $file"
              exit 1
            fi
          done

      - name: Commit cards
        if: ${{ !env.ACT }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update README cards"
            git push
          else
            echo "No changes to commit."
          fi
