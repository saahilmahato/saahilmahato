name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&hide=stars'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&langs_count=6'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Validate generated cards
        run: |
          set -e

          for file in profile/stats.svg profile/top-langs.svg; do
            test -s "$file" || {
              echo "::error::Missing or empty SVG: $file"
              exit 1
            }

            grep -q '<svg' "$file" || {
              echo "::error::Invalid SVG output: $file"
              exit 1
            }
          done

      - name: Commit cards
        if: ${{ !env.ACT }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update README cards"
            git push
          else
            echo "No changes to commit."
          fi